name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --locked --release
      - name: Terminal lifecycle
        run: python3 tools/pty_smoke.py target/release/lattice
      - name: Onboarding interactions
        run: python3 tools/onboarding_smoke.py target/release/lattice
      - name: Practical workflow interactions
        run: python3 tools/practical_smoke.py target/release/lattice
      - name: Navigation interactions
        run: python3 tools/navigation_smoke.py target/release/lattice
      - name: Local recording workflows
        run: python3 tools/recording_smoke.py target/release/lattice
      - name: Failure-path cleanup
        run: python3 tools/fault_smoke.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test minimum supported Rust
        run: cargo +1.95.0 test --locked
